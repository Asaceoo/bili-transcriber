<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="AI 集成：CLI 与 MCP 两条通道共用同一套服务层">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1222"/>
      <stop offset="1" stop-color="#131E36"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6B8C"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#abg)"/>

  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="48" y="50" fill="#FFFFFF" font-size="22" font-weight="600">桌面端之外，给 AI 留两个门</text>
    <text x="48" y="76" fill="#8296B5" font-size="13">CLI 与 MCP 共用 Service 层，读写同一份 data/，不另起一套历史</text>

    <!-- 客户端 -->
    <g>
      <rect x="48" y="112" width="196" height="58" rx="12" fill="#16213A" stroke="#2B3A5C"/>
      <text x="146" y="139" fill="#FFFFFF" font-size="15" text-anchor="middle">WorkBuddy</text>
      <text x="146" y="159" fill="#8296B5" font-size="12" text-anchor="middle">MCP 客户端</text>

      <rect x="48" y="184" width="196" height="58" rx="12" fill="#16213A" stroke="#2B3A5C"/>
      <text x="146" y="211" fill="#FFFFFF" font-size="15" text-anchor="middle">DeepSeek-Honey</text>
      <text x="146" y="231" fill="#8296B5" font-size="12" text-anchor="middle">MCP 客户端</text>

      <rect x="48" y="256" width="196" height="58" rx="12" fill="#16213A" stroke="#2B3A5C"/>
      <text x="146" y="283" fill="#FFFFFF" font-size="15" text-anchor="middle">脚本 / 自动化</text>
      <text x="146" y="303" fill="#8296B5" font-size="12" text-anchor="middle">CLI + JSON</text>
    </g>

    <!-- 连线 -->
    <line x1="248" y1="141" x2="330" y2="168" stroke="#5A6B8C" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="248" y1="213" x2="330" y2="200" stroke="#5A6B8C" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="248" y1="285" x2="330" y2="288" stroke="#5A6B8C" stroke-width="2" marker-end="url(#arrow2)"/>

    <!-- 通道 -->
    <g>
      <rect x="330" y="140" width="170" height="72" rx="12" fill="#1B2A4A" stroke="#4CC2FF" stroke-opacity="0.5"/>
      <text x="415" y="168" fill="#BFE6FF" font-size="15" text-anchor="middle">MCP stdio</text>
      <text x="415" y="190" fill="#8296B5" font-size="12" text-anchor="middle">JSON-RPC 2.0 · 9 个工具</text>

      <rect x="330" y="252" width="170" height="72" rx="12" fill="#1B2A4A" stroke="#35D07F" stroke-opacity="0.45"/>
      <text x="415" y="280" fill="#B9F3D5" font-size="15" text-anchor="middle">CLI</text>
      <text x="415" y="302" fill="#8296B5" font-size="12" text-anchor="middle">JSON 输出 · 退出码 0/1/2</text>
    </g>

    <line x1="504" y1="176" x2="586" y2="196" stroke="#5A6B8C" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="504" y1="288" x2="586" y2="268" stroke="#5A6B8C" stroke-width="2" marker-end="url(#arrow2)"/>

    <!-- Service -->
    <g>
      <rect x="590" y="140" width="180" height="184" rx="14" fill="#16213A" stroke="#B98BFF" stroke-opacity="0.5"/>
      <text x="680" y="170" fill="#D9C2FF" font-size="16" text-anchor="middle">Service</text>
      <line x1="614" y1="184" x2="746" y2="184" stroke="#2B3A5C"/>
      <g fill="#9FB2D0" font-size="12">
        <text x="612" y="208">submit / wait</text>
        <text x="612" y="230">status / list</text>
        <text x="612" y="252">transcript</text>
        <text x="612" y="274">settings / prewarm</text>
        <text x="612" y="296">cancel</text>
      </g>
    </g>

    <line x1="774" y1="232" x2="856" y2="232" stroke="#5A6B8C" stroke-width="2" marker-end="url(#arrow2)"/>

    <!-- 应用内核 -->
    <g>
      <rect x="860" y="140" width="290" height="184" rx="14" fill="#1A1F33" stroke="#FB7299" stroke-opacity="0.5"/>
      <text x="1005" y="170" fill="#FFB3C7" font-size="16" text-anchor="middle">Pipeline（与桌面端同一套）</text>
      <g fill="#9FB2D0" font-size="12.5">
        <text x="884" y="200">下载 → 转码 → 转写 → 落盘</text>
        <text x="884" y="226">模型懒加载 · 空闲卸载 · 断点续跑</text>
        <text x="884" y="252">worker 串行转写（GPU 不并发）</text>
        <text x="884" y="278">恢复上次未完成的任务</text>
        <text x="884" y="304">产物路径为绝对路径</text>
      </g>
    </g>

    <!-- 共享存储 -->
    <rect x="330" y="350" width="820" height="34" rx="8" fill="#111B30" stroke="#22304D"/>
    <text x="740" y="372" fill="#8296B5" font-size="13" text-anchor="middle">
      共享 data/history.db（任务历史）与 data/settings.json（引擎、模型、Cookie、输出目录）
    </text>
  </g>
</svg>
