[project]
name = "bili-transcriber"
version = "0.1.0"
description = "B站音频本地转写桌面工具:yt-dlp 下载 + faster-whisper GPU 转写,输出 SRT/TXT/Markdown"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1.0",
    "nicegui>=2.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bili-transcriber = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
