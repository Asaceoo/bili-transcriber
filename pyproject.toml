[project]
name = "bili-transcriber"
version = "0.1.3"
description = "B站音频本地转写桌面工具:yt-dlp 下载 + faster-whisper GPU 转写,输出 SRT/TXT/Markdown"
readme = "README.md"
license = "MIT"
authors = [{ name = "Asaceoo" }]
keywords = ["bilibili", "whisper", "transcribe", "speech-to-text", "desktop"]

requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2025.1.1",
    "faster-whisper>=1.1.0",
    "nvidia-cublas-cu12>=12.6",
    "nvidia-cudnn-cu12>=9.0",
    "nicegui>=2.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
bili-transcriber = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
main_file = "app/main.py"
